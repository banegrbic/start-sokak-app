<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KulaWireless start page icon">
  <!-- Deblja, transparentna pozadina. Boja postavljena na nivo ikonice
       (neutralan srednji plavi) — vidljiv i na beloj i na tamnoj pozadini. -->
  <g fill="none" stroke="#4a90e2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Strelica: linija od kvadrata do vrha -->
    <line x1="20" y1="44" x2="48" y2="16" />
    <!-- Glava strelice (gore-desno) -->
    <polyline points="26,16 48,16 48,38" />
  </g>
  <!-- Kvadrat (izvor linka) -->
  <rect x="6" y="36" width="20" height="20" rx="3" fill="#4a90e2" />
</svg>
